# Describes the format for available notification services

notify:
  fields:
    message:
      required: true
      example: The garage door has been open for 10 minutes.
      selector:
        text:
    title:
      example: "Your Garage Door Friend"
      selector:
        text:
    target:
      example: platform specific
      selector:
        object:
    data:
      example: platform specific
      selector:
        object:

send_message:
  target:
    entity:
      domain: notify
  fields:
    message:
      required: true
      selector:
        text:
    title:
      required: false
      selector:
        text:
      filter:
        supported_features:
          - notify.NotifyEntityFeature.TITLE
    priority:
      required: false
      selector:
        select:
          options:
            - label: "Minimum"
              value: "1"
            - label: "Low"
              value: "2"
            - label: "Normal"
              value: "3"
            - label: "High"
              value: "4"
            - label: "Highest"
              value: "5"
      filter:
        supported_features:
          - notify.NotifyEntityFeature.PRIORITY

persistent_notification:
  fields:
    message:
      required: true
      example: The garage door has been open for 10 minutes.
      selector:
        text:
    title:
      example: "Your Garage Door Friend"
      selector:
        text:
    data:
      example: platform specific
      selector:
        object:
